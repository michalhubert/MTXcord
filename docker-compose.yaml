services:
  mtxcord-media:
    image: mikko99/mtxcord-media:latest
    container_name: mtxcord-media
    restart: unless-stopped

    user: "1200:1200" # Change to any user that has access to volume files or remove to run as root

    environment:
      PLAYER_DOMAIN: ${PLAYER_DOMAIN:-}
      STREAMER_PASSWORD: ${STREAMER_PASSWORD:?Set STREAMER_PASSWORD}
      API_TRUSTED_PROXIES: ${API_TRUSTED_PROXIES:-0.0.0.0/0,::/0}
      WEBRTC_TRUSTED_PROXIES: ${WEBRTC_TRUSTED_PROXIES:-0.0.0.0/0,::/0}
      WEBRTC_ADDITIONAL_HOSTS: ${WEBRTC_ADDITIONAL_HOSTS:-0.0.0.0,rtc.domain.com}
      # you can overwrite built in script using these env variables and proper volume containing new scripts
      HOOK_ONLINE: ${HOOK_ONLINE:-/hooks/stream-online.sh}
      HOOK_ONLINE_RESTART: ${HOOK_ONLINE_RESTART:-false}
      HOOK_OFFLINE: ${HOOK_OFFLINE:-/hooks/stream-offline.sh}
      # Runs when a viewer starts/stops watching; empty turns it off
      HOOK_VIEWER: ${HOOK_VIEWER-/hooks/stream-viewer.sh}
      # Where the hooks reach Next.js; change if you rename the mtxcord-web service or run it elsewhere
      NEXTJS_URL: ${NEXTJS_URL:-http://mtxcord-web:3000}
      # Sent by the hooks to Next.js; must match the mtxcord-web service
      HOOK_SECRET: ${HOOK_SECRET:-${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET}}
      # MediaMTX's UDP read buffer size (bytes). MediaMTX docs recommend
      # raising this to avoid dropped WebRTC/RTP packets under load.
      UDP_READ_BUFFER_SIZE: ${UDP_READ_BUFFER_SIZE:-1000000}

    volumes:
      - ./mediamtx/hooks:/opt/hooks:ro # custom hooks if needed
      - ./mediamtx/paths.yml:/opt/streams/paths.yml:ro # path configuration

    ports:
      # 8889 is exposed so OBS (running on the streamer's own machine, not
      # inside this Docker network) can reach MediaMTX directly for WHIP
      # publishing. Next.js still proxies WHEP internally for viewers.
      - "8889:8889" # WebRTC WHIP publish (OBS) / WHEP signaling
      - "8189:8189/udp" # RTP media goes direct browser ↔ MediaMTX over UDP

    networks:
      - stream

  mtxcord-web:
    image: mikko99/mtxcord-web:latest
    container_name: mtxcord-web
    restart: unless-stopped

    environment:
      MEDIAMTX_HOST: ${MEDIAMTX_HOST:-mtxcord-media}
      MEDIAMTX_PORT: ${MEDIAMTX_PORT:-8889}
      MEDIAMTX_API_PORT: ${MEDIAMTX_API_PORT:-9997}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET, e.g. openssl rand -hex 32}
      # Checked on MediaMTX's stream hook; must match the mtxcord-media service
      HOOK_SECRET: ${HOOK_SECRET:-${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET}}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-}
      # Header your reverse proxy puts the client's IP in, e.g. cf-connecting-ip (see README). Empty means x-forwarded-for,
      # and TRUSTED_NETWORKS is ignored until this is set.
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      TRUSTED_NETWORKS: ${TRUSTED_NETWORKS:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      # Optional per-path webhook overrides, e.g. "desktop:https://discord.com/...,gaming:https://discord.com/..."
      DISCORD_WEBHOOK_URLS: ${DISCORD_WEBHOOK_URLS:-}
      PLAYER_DOMAIN: ${PLAYER_DOMAIN:-}
      # Streamer password, also used by MediaMTX's "streamer" WHIP publish user.
      # Grants access to the /dock OBS HUD.
      STREAMER_PASSWORD: ${STREAMER_PASSWORD:?Set STREAMER_PASSWORD}
      # Discord OAuth app credentials (https://discord.com/developers/applications)
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      # Set to "true" to show the "Sign in with Discord" button on the login page
      NEXT_PUBLIC_DISCORD_ENABLED: ${NEXT_PUBLIC_DISCORD_ENABLED:-false}
      # Set to "true" to disable authentication on /dock and /stream (useful when behind reverse proxy with local-only access)
      DISABLE_DOCK_AUTH: ${DISABLE_DOCK_AUTH:-false}
      # Minutes a kicked or denied viewer is kept out (comma-separated), growing with each repeat kick/denial, e.g. "1,5,15"
      DENIAL_TIMEOUTS: ${DENIAL_TIMEOUTS:-1,5,15}
      # Optional Derpibooru filter ID for guest (non-Discord) avatars; empty uses Derpibooru's default filter
      GUEST_AVATAR_FILTER_ID: ${GUEST_AVATAR_FILTER_ID:-}
      # Optional extra Derpibooru tags every guest avatar must have, e.g. "cute,smiling" (prefix with - to exclude)
      GUEST_AVATAR_TAGS: ${GUEST_AVATAR_TAGS:-}
      # Optional file replacing the built-in guest pony names, e.g. /data/pony-names.txt (put it in the config folder)
      GUEST_PONY_NAMES_FILE: ${GUEST_PONY_NAMES_FILE:-}

    volumes:
      - ./config:/data # config files, and the SQLite database (saved /stream settings) in config/sqlite

    ports:
      - "${NEXTJS_PORT:-8080}:3000"

    depends_on:
      - mtxcord-media

    networks:
      - stream

networks:
  stream:
