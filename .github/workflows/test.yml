name: Tests

# Called by docker-build.yml so the tests run once per push/PR.
# E2E tests (Playwright) are local-only and intentionally not run here.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  unit-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: nextjs
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci

      # next build type-checks tests/ too, so a type error there would break local builds
      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration
